server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresion de los recursos de texto.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Los assets con hash se pueden cachear de forma agresiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta desconocida se resuelve con index.html (React maneja el enrutado).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
